---
# vars file for jitsi
jitsi_docker_directory: /opt/jitsi/docker
jitsi_config_directory: /opt/jitsi/config

jitsi_container_uid: 1000
jitsi_container_gid: 1000

jitsi_secret_names:
  - JICOFO_AUTH_PASSWORD
  - JVB_AUTH_PASSWORD
  - JIGASI_XMPP_PASSWORD
  - JIGASI_TRANSCRIBER_PASSWORD
  - JIBRI_RECORDER_PASSWORD
  - JIBRI_XMPP_PASSWORD

jitsi_config_subdirectories:
  - jicofo
  - jicofo/custom-ca
  - jvb
  - jvb/custom-ca
  - prosody
  - prosody/config
  - prosody/custom-ca
  - prosody/prosody-plugins-custom
  - storage/prosody
  - storage/transcripts
  - storage/web
  - tmp/web-load-test
  - web
  - web/custom-ca
